apiVersion: 1

# NOTE: Grafana expands $VAR in provisioning files, so a literal "$" is written "$$".

deleteDatasources:
  - name: Prometheus
  - name: Loki
  - name: Tempo

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      # jump from an exemplar on a graph straight to its trace
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # trace_id arrives as OTLP structured metadata; turn it into a link to Tempo
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      # trace -> logs
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: false
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
        customQuery: true
        query: '{$${__tags}} | trace_id="$${__span.traceId}"'
      # trace -> metrics
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags, span_kind="SPAN_KIND_SERVER"}[$$__rate_interval]))'
          - name: p95 latency
            query: 'histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags, span_kind="SPAN_KIND_SERVER"}[$$__rate_interval])))'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus

  # business KPIs (users, accounts, transactions) are read straight from the VBank database
  - name: VBank Postgres
    uid: vbank-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: admin
    editable: false
    secureJsonData:
      password: cantremember
    jsonData:
      database: vbank
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 5
