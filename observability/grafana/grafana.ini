; Grafana UI / server configuration (mounted at /etc/grafana/grafana.ini).
; Admin credentials come from GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD in docker-compose.yml.

[server]
http_port = 3000
root_url = %(protocol)s://%(domain)s:3030/

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[users]
default_theme = dark
allow_sign_up = false

[auth.anonymous]
; read-only access without login, handy for a wall display; set enabled = false to require login
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/vbank-platform-overview.json
min_refresh_interval = 5s

[unified_alerting]
enabled = true

[log]
mode = console
level = info
