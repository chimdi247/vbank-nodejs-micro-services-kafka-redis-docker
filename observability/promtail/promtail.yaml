server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=vbank"]
    relabel_configs:
      # skip the Node services: their logs already arrive via OTLP
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: api-gateway|auth-service|account-service|transaction-service|mock-central-bank-service
        action: drop
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      # same label name Loki uses for OTLP's service.name, so queries are consistent
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service_name
    pipeline_stages:
      - docker: {}
